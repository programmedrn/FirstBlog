# Site configuration
# 1. Files excluded from Jekyll builds
# 2. Installed Gems
# 3. Gem settings
# 4. Jekyll settings
# 5. Collections
# 6. Jekyll collections settings
# 7. Site settings
# 8. Site favicons & manifest icons
# 9. Site navigation

# All theme files live in this repository, so no `remote_theme` is used.
# (It used to pull an unpinned third-party theme branch on every build.)

# 1. Files excluded from Jekyll builds
exclude:
- README* # README.md and local copies such as "README origin.md" are repository docs, not site pages
- CODE_OF_CONDUCT.md
- CONTRIBUTING.md
- screenshot.png
- LICENSE
- CNAME
- Gemfile
- Gemfile.lock
- .jekyll-cache
- vendor/ # Local `bundle install --path vendor/bundle`; this list replaces Jekyll's default excludes
- .bundle/

# 2. Installed Gems
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-feed
- jekyll-include-cache
- jemoji

# 3. Gem settings
paginate: 5 # jekyll-paginate > items per page
paginate_path: blog/page:num # jekyll-paginate > blog page
# jekyll-mentions: https://twitter.com # jekyll-mentions > service used when @replying
# twitter:
  # username: FirstBlog # jekyll-seo-tag > Owners twitter username
author: FirstBlog # jekyll-seo-tag > default author
social: # jekyll-seo-tag > social overrides
  name: FirstBlog # jekyll-seo-tag > real name
  links:  # jekyll-seo-tag > social aliases (sameAs)
    - https://github.com/programmedrn/

# Markdown: GitHub Flavored Markdown via kramdown, code highlighting via Rouge (what GitHub Pages uses)
# Add the language after the opening fence to get highlighting, e.g. ```java, ```sql, ```bash
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 4. Jekyll settings
sass:
  style: compressed # Style compression
permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone: Asia/Seoul # Timezone for blog posts and alike

# 5. Collections
collections:
  posts:
    title: Thoughts # Needed for Siteleaf
    output: true
    description: "here you are" # The post list page content
    feature_text: |
      In my opinion...
    feature_image: "/FirstBlog/assets/books.jpg"
  updates: # Site change log, listed on the Update page (update.html)
    output: true
    permalink: /update/:name/

# 6. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
    values:
      image: "/assets/default-social-image.png" # Default image for sharing
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
      heads: true
      comments: true
  -
    scope:
      path: ""
      type: "updates"
    values:
      layout: post # Same look as posts, without comments
      heads: true
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right
lang: en-GB # Set the site language
title: "FirstBlog" # Site name or title, also used in jekyll-seo-tag
logo: "/assets/logos/logo.svg" # Site logo, also used in jekyll-seo-tag
description: "What I'm thinking these days...." # Site description and default description, also used in jekyll-seo-tag
url: "https://programmedrn.github.io" # Site url, also used in jekyll-seo-tag
baseurl: "/FirstBlog"
repo: "https://github.com/programmedrn/"
# disqus: "alembic-1" # Blog post comments, uncomment the option and set the site ID from your Disqus account
date_format: "%-d %B %Y" # Blog post date formatting using placeholder formatting
# google_analytics: ""
# google_analytics_anonymize_ip: ""
# service_worker: false # Will turn off the service worker if set to false
short_name: "FirstB" # The web application short name, defaults to the site title
css_inline: true # Will insert all styles into a single <style> block in the <head> element and remove the style <link> reference
manifest: # Browser UI / installed web app colours, keep in sync with _sass/_theme-dark-blue-orange.scss
  theme_color: "#0b141b"
  background_color: "#0b141b"

# 8. Site favicons & manifest icons
favicons: # Favicons are also used in the manifest file. Syntax is 'size: path'
# TODO: differs per stages
  16: '/assets/logos/logo@16px.png'
  32: '/assets/logos/logo@32px.png'
  96: '/assets/logos/logo@96px.png'
  120: '/assets/logos/logo@120px.png'
  144: '/assets/logos/logo@144px.png'
  180: '/assets/logos/logo@180px.png'
  512: '/assets/logos/logo@512px.png'
  1024: '/assets/logos/logo@1024px.png'

# 9. Site navigation
navigation_header:
- title: Home
  url: /
# - title: Elements
#   url: /elements/
- title: Thoughts
  url: /blog/
- title: Categories
  url: /categories/
- title: Update
  url: /update/
- title: Search
  url: /search/

navigation_footer:
- title: Created by David Darnes
  url: https://darn.es

social_links: # Appears in sidebar. Set the urls then uncomment and comment out as desired
  GitHub: https://github.com/programmedrn
  RSS: /feed.xml

sharing_links: # Appear at the bottom of single blog posts, add as desired. The value can be 'true' or the desired button colour
  # Twitter: "#0d94e7"
  # facebook: "#3B5998"
  Email: true

