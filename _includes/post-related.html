<h3>Related posts</h3>
<ul class="list  list--related">
  {% for related in site.related_posts limit: 3 %}
    {% assign has_related = true %}
    <li class="item">
      <a href="{{ related.url | relative_url }}">{{ related.title }}</a>
      <time datetime="{{ related.date | date_to_xmlschema }}">{{ related.date | date: "%Y-%m-%d" }}</time>
    </li>
  {% endfor %}
</ul>

{% if has_related != true %}
  <p>There are no related posts</p>
{% endif %}
